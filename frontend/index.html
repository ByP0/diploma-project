<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecommerce Frontend</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(760px, 100%);
        border: 1px solid #d9e0ea;
        border-radius: 8px;
        background: #ffffff;
        padding: 32px;
        box-shadow: 0 16px 40px rgba(23, 32, 51, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 24px;
        color: #526071;
        line-height: 1.6;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        padding: 0 14px;
        border: 1px solid #cfd8e3;
        border-radius: 6px;
        color: #0b5cad;
        text-decoration: none;
        font-weight: 600;
      }

      a:hover {
        border-color: #0b5cad;
        background: #eef6ff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Frontend запущен</h1>
      <p>
        Это минимальная статическая страница для Docker-сборки. Backend и OpenAPI
        доступны через общий nginx gateway.
      </p>
      <nav aria-label="Ссылки проекта">
        <a href="/docs">OpenAPI docs</a>
        <a href="/health">Backend health</a>
        <a href="/backend-admin">Backend admin</a>
      </nav>
    </main>
  </body>
</html>
