apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-outbox-publisher
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop-outbox-publisher
  template:
    metadata:
      labels:
        app: shop-outbox-publisher
    spec:
      containers:
        - name: worker
          image: ghcr.io/example/shop-backend:latest
          command: ["python", "-m", "app.workers.outbox_publisher"]
          envFrom:
            - configMapRef:
                name: shop-backend-config
            - secretRef:
                name: shop-backend-secrets
---
