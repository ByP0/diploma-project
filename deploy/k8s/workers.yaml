---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: shop-cleanup-worker
  namespace: shop
spec:
  schedule: "*/15 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cleanup
              image: ghcr.io/example/shop-backend:latest
              command: ["python", "-m", "app.workers.cleanup_worker", "--once"]
              envFrom:
                - configMapRef:
                    name: shop-backend-config
                - secretRef:
                    name: shop-backend-secrets
