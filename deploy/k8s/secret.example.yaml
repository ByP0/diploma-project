apiVersion: v1
kind: Secret
metadata:
  name: shop-backend-secrets
  namespace: shop
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://user:password@managed-postgres.example.com:5432/shop
  MONGODB_URL: mongodb://managed-mongo.example.com:27017
  REDIS_URL: redis://managed-redis.example.com:6379/0
  BROKER_URL: amqps://user:password@managed-rabbitmq.example.com/
  JWT_SECRET: replace-with-secret-manager-value
  PAYMENT_WEBHOOK_SECRET: replace-with-secret-manager-value
  DELIVERY_WEBHOOK_SECRET: replace-with-secret-manager-value
  SENTRY_DSN: ""
  OPENAI_API_KEY: ""
